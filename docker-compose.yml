version: '3.9'

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  backend:
    build: ./backend
    ports:
      - "8000:8000"

  semantic-engine:
    build: ./semantic-engine
    ports:
      - "8001:8001"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coralops

  redis:
    image: redis:7
    ports:
      - "6379:6379"
